name: laravel-demo-build

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: 8.3
          extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml

      - name: Install Composer dependencies
        run: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --no-interaction --prefer-dist    

      - name: Install npm dependencies
        run: npm install

      - name: Create unified .env for build
        run: |
          echo "APP_ENV=${{ secrets.DEMO_APP_ENV }}" >> .env
          echo "VITE_APP_ENV=${{ secrets.DEMO_VITE_APP_ENV }}" >> .env
          echo "DB_CONNECTION=${{ secrets.DEMO_DB_CONNECTION }}" >> .env
          echo "DB_HOST=${{ secrets.DEMO_DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DEMO_DB_PORT }}" >> .env
          echo "DB_DATABASE=${{ secrets.DEMO_DB_DATABASE }}" >> .env
          echo "DB_USERNAME=${{ secrets.DEMO_DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DEMO_DB_PASSWORD }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.DEMO_GEMINI_API_KEY }}" >> .env

      - name: Build assets
        run: npx vite build --mode demo

      - name: Clean up
        run: |
          rm -rf node_modules
          rm -rf storage/app/public/activities
          rm -rf storage/app/public/certifications
          rm -rf storage/app/public/logos
          mkdir -p storage/app/private/orders/

      - name: Archive application
        run: tar -czf app.tgz ./*

      - name: SSH SCP and deployment for demo
        uses: cross-the-world/ssh-scp-ssh-pipelines@latest
        env:
          WELCOME: "ssh scp ssh pipelines"
          LASTSSH: "Deploying to demo"
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          user: ${{ secrets.DEMO_SSH_USER }}
          pass: ${{ secrets.DEMO_SSH_PASSWORD }}
          port: ${{ secrets.DEMO_SSH_PORT }}
          connect_timeout: 10s
          scp: |
            './app.tgz' => ${{ secrets.DEMO_SSH_DIR }}
          last_ssh: |
            set -e
            set -x

            cd ${{ secrets.DEMO_SSH_DIR }}
            tar -xzf app.tgz

            COMPOSER_ALLOW_SUPERUSER=1 composer install --optimize-autoloader --no-dev

            php artisan migrate --force
            php artisan db:seed --force
            php artisan storage:link
            php artisan key:generate

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            mkdir -p storage/framework/views
            chown -R www-data:www-data storage
            chmod -R 775 storage
