name: laravel-prod-build

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: 8.3
          extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml

      - name: Install Composer dependencies
        run: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --no-interaction --prefer-dist    

      - name: Install npm dependencies
        run: npm install

      - name: Build assets
        run: npx vite build --mode prod

      - name: Clean up
        run: |
          rm -rf node_modules
          rm -rf storage/app/public/activities
          rm -rf storage/app/public/certifications
          rm -rf storage/app/public/logos
          mkdir -p storage/app/private/orders/

      - name: Archive application
        run: tar -czf app.tgz ./*

      - name: SSH SCP and deployment for prod
        uses: cross-the-world/ssh-scp-ssh-pipelines@latest
        env:
          WELCOME: "ssh scp ssh pipelines"
          LASTSSH: "Deploying to production"
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          user: ${{ secrets.PROD_SSH_USER }}
          pass: ${{ secrets.PROD_SSH_PASSWORD }}
          port: ${{ secrets.PROD_SSH_PORT }}
          connect_timeout: 10s
          scp: |
            './app.tgz' => ${{ secrets.PROD_SSH_DIR }}
          last_ssh: |
            set -e
            set -x

            cd ${{ secrets.PROD_SSH_DIR }}
            tar -xzf app.tgz

            COMPOSER_ALLOW_SUPERUSER=1 composer install --optimize-autoloader --no-dev

            cp env.example .env
            sed -i "s/APP_ENV=.*/APP_ENV=${{ secrets.PROD_APP_ENV }}/" .env
            sed -i "s/VITE_APP_ENV=.*/VITE_APP_ENV=${{ secrets.PROD_VITE_APP_ENV }}/" .env
            sed -i "s/DB_CONNECTION=.*/DB_CONNECTION=${{ secrets.PROD_DB_CONNECTION }}/" .env
            sed -i "s/DB_HOST=.*/DB_HOST=${{ secrets.PROD_DB_HOST }}/" .env
            sed -i "s/DB_PORT=.*/DB_PORT=${{ secrets.PROD_DB_PORT }}/" .env
            sed -i "s/DB_DATABASE=.*/DB_DATABASE=${{ secrets.PROD_DB_DATABASE }}/" .env
            sed -i "s/DB_USERNAME=.*/DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}/" .env
            sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}/" .env
            sed -i "s/GEMINI_API_KEY=.*/GEMINI_API_KEY=${{ secrets.PROD_GEMINI_API_KEY }}/" .env
            sed -i "s/OPENAI_API_KEY=.*/OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}/" .env

            php artisan migrate --force
            php artisan storage:link
            php artisan key:generate
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            mkdir -p storage/framework/views
            chown -R www-data:www-data storage
            chmod -R 775 storage
