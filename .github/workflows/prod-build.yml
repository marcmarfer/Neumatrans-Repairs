name: laravel-prod-build

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: 8.3
          extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml

      - name: Install Composer dependencies
        run: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --no-interaction --prefer-dist    

      - name: Install npm dependencies
        run: npm install

      - name: Create unified .env for build
        run: |
          echo "APP_ENV=${{ secrets.PROD_APP_ENV }}" >> .env
          echo "VITE_APP_ENV=${{ secrets.PROD_VITE_APP_ENV }}" >> .env
          echo "DB_CONNECTION=${{ secrets.PROD_DB_CONNECTION }}" >> .env
          echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.PROD_DB_PORT }}" >> .env
          echo "DB_DATABASE=${{ secrets.PROD_DB_DATABASE }}" >> .env
          echo "DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.PROD_GEMINI_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}" >> .env

      - name: Build assets
        run: npx vite build --mode prod

      - name: Clean up
        run: |
          rm -rf node_modules
          rm -rf storage/app/public/activities
          rm -rf storage/app/public/certifications
          rm -rf storage/app/public/logos
          mkdir -p storage/app/private/orders/

      - name: Remove Laravel cache files before packaging
        run: |
          rm -f bootstrap/cache/*.php

      - name: Archive application
        run: tar -czf app.tgz ./*

      - name: SSH SCP and deployment for prod
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: "app.tgz"
          target: ${{ secrets.PROD_SSH_DIR }}

      - name: Execute remote production deployment commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -e
            set -x
            cd ${{ secrets.PROD_SSH_DIR }}
            tar -xzf app.tgz
            COMPOSER_ALLOW_SUPERUSER=1 composer install --optimize-autoloader --no-dev
            php artisan config:clear
            php artisan view:clear
            php artisan cache:clear
            php artisan migrate --force
            php artisan storage:link
            php artisan key:generate
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            mkdir -p storage/framework/views
            chown -R www-data:www-data storage
            chmod -R 775 storage
